# Docker's json-file driver never rotates by default, so container output would
# grow forever. Capped for both services: gunicorn's request log and Caddy's
# runtime log (its access log goes to a file instead, see Caddyfile).
x-logging: &rotated-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    build: .
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - lucid_data:/app/data
    expose:
      - "8000"
    logging: *rotated-logs

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      SITE_ADDRESS: ${SITE_DOMAIN:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Rotated access logs (see Caddyfile). A volume so they survive a recreate.
      - caddy_logs:/var/log/caddy
    logging: *rotated-logs

volumes:
  lucid_data:
  caddy_data:
  caddy_config:
  caddy_logs:
